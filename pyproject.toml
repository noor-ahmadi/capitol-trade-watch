[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capitol-trade-watch"
version = "0.1.0"
description = "GitHub alerts for newly published congressional trade disclosures"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Noor Ahmadi" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[project.urls]
Repository = "https://github.com/noor-ahmadi/capitol-trade-watch"

[project.scripts]
capitol-trade-watch = "capitol_trade_watch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
