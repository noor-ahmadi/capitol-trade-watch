name: Manual monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should the watcher do?
        required: true
        default: preview
        type: choice
        options:
          - preview
          - seed
          - test-alert

permissions: {}

concurrency:
  group: manual-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview unseen filings
    if: ${{ inputs.mode == 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install watcher
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps --editable .

      - name: Render preview without changing state
        run: |
          python -m capitol_trade_watch preview > preview.md
          cat preview.md
          cat preview.md >> "$GITHUB_STEP_SUMMARY"

  seed:
    name: Quietly seed existing filings
    if: ${{ inputs.mode == 'seed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install watcher
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps --editable .

      - name: Save the current filing baseline
        run: python -m capitol_trade_watch seed

      - name: Commit the ledger if it changed
        run: |
          if git diff --quiet -- data/state.json; then
            echo "The filing ledger was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "update filing state"
          git push origin HEAD:main

  test-alert:
    name: Send a synthetic test issue
    if: ${{ inputs.mode == 'test-alert' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install watcher
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps --editable .

      - name: Create synthetic test issue (no trade)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m capitol_trade_watch test-alert
