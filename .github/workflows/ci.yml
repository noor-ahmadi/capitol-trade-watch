name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-deps --editable .

      - name: Compile package and tests
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m pytest

      - name: Validate tracked-people configuration
        run: python -m capitol_trade_watch validate-config
